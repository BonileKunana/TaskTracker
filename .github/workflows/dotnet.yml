
name: TaskTracker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check installed .NET SDK
        run: dotnet --list-sdks
        
          

      - name: Restore dependencies
        run: dotnet restore TaskTracker.Api.Tests/TaskTracker.Api.Tests.csproj

      - name: Build
        run: dotnet build TaskTracker.Api.Tests/TaskTracker.Api.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TaskTracker.Api.Tests/TaskTracker.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
